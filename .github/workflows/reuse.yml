name: Reuse other workflow

on: workflow_dispatch

jobs:
  call-workflow:
    uses: ./.github/workflows/reusable.yml
    with:
      who-to-greet: '@michal-apetito'

  use-output:
    runs-on: ubuntu-latest
    needs: call-workflow
    steps:
      - name: Print greeting time
        env:
          GREETING_TIME: ${{ needs.call-workflow.outputs.current-time }}
        run: echo "Time was $GREETING_TIME"